<!DOCTYPE html>
<html lang="en">
  <head>
    <link rel="stylesheet" href="style.css" />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DevMemory Login</title>
  </head>
  <body>
    <div class="login-shell">
      <div class="brand">
        <h1>DevMemory</h1>
        <p>Sign in to your memory bank</p>
      </div>

      <div class="card">
        <button class="social-btn" type="button">Continue with GitHub</button>
        <button class="social-btn" type="button">Continue with Google</button>

        <div class="divider">or continue with email</div>

        <form action="devmemory.html" method="get">
          <div class="field">
            <label class="label-row" for="email">Email Address</label>
            <div class="input-wrap">
              <svg class="icon" viewBox="0 0 24 24" fill="none" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
                <path d="M4 7.5A2.5 2.5 0 0 1 6.5 5h11A2.5 2.5 0 0 1 20 7.5v9A2.5 2.5 0 0 1 17.5 19h-11A2.5 2.5 0 0 1 4 16.5v-9Zm2.1-.5 6.9 5.2 6.9-5.2" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
              <input id="email" type="email" aria-label="Email Address" required />
            </div>
          </div>

          <div class="field">
            <div class="label-row">
              <label for="password">Password</label>
              <a href="#">Forgot password?</a>
            </div>
            <div class="input-wrap">
              <svg class="icon" viewBox="0 0 24 24" fill="none" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
                <path d="M7 10V8.5A5 5 0 0 1 12 3.5a5 5 0 0 1 5 5V10M6 10h12a2 2 0 0 1 2 2v7a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2v-7a2 2 0 0 1 2-2Zm6 4v2" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
              <input id="password" type="password" aria-label="Password" required />
            </div>
          </div>

          <button class="signin-btn" type="submit">Sign In →</button>
        </form>

        <div class="signup">Don't have an account? <a href="#">Sign up</a></div>
      </div>
    </div>
  </body>
</html>
